<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kurtis Massey | Portfolio</title>
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <!-- CSS -->
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/menu.css" />
        <link rel="stylesheet" href="css/terminal.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/scroll.css" />
        <link rel="stylesheet" href="css/responsive.css" />
    </head>
    <body>
        <!-- Background -->
        <canvas id="matrix"></canvas>

        <!-- Nav bar -->
        <nav class="menu-bar">
            <div class="menu-bar-left">
                <a
                    href="https://github.com/kurtismassey"
                    target="_blank"
                    class="menu-logo"
                    title="GitHub"
                >
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                        ></path>
                    </svg>
                </a>
                <a href="#home" class="menu-item">Home</a>
                <a href="#about" class="menu-item">About</a>
                <a href="#experience" class="menu-item">Experience</a>
                <a href="#certifications" class="menu-item">Certifications</a>
                <a href="#contributions" class="menu-item">Contributions</a>
            </div>
            <div class="menu-bar-right">
                <a
                    href="https://linkedin.com/in/kurtismassey"
                    target="_blank"
                    class="menu-icon"
                    title="LinkedIn"
                >
                    <svg
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                        ></path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container">
            <!-- Home Section -->
            <section id="home" class="section section-full">
                <div class="section-content">
                    <header class="header">
                        <div class="terminal-container">
                            <div class="terminal-line">
                                <span class="terminal-prompt">$</span>
                                <span
                                    class="terminal-command"
                                    id="command-text"
                                ></span>
                                <span class="terminal-cursor">█</span>
                            </div>
                            <div
                                class="terminal-output"
                                id="terminal-output"
                            ></div>
                        </div>
                    </header>
                </div>
                <div class="scroll-indicator">
                    <div class="scroll-arrow"></div>
                    <span class="scroll-text">scroll</span>
                </div>
            </section>

            <!-- About Section -->
            <section id="about" class="section section-full">
                <div class="section-content">
                    <div class="terminal-header">
                        <span class="terminal-prompt">$</span>
                        <span class="terminal-command-static"
                            >cat about.txt</span
                        >
                    </div>
                    <h2 class="section-title">About</h2>
                    <div class="about-terminal" id="about-terminal">
                        <div class="terminal-output" id="about-output">
                            <!-- Bio and award go here -->
                        </div>
                    </div>
                </div>
                <div class="scroll-indicator">
                    <div class="scroll-arrow"></div>
                    <span class="scroll-text">scroll</span>
                </div>
            </section>

            <!-- Experience Section -->
            <section id="experience" class="section section-full">
                <div class="section-content">
                    <div class="terminal-header">
                        <span class="terminal-prompt">$</span>
                        <span class="terminal-command-static"
                            >cat experience.log</span
                        >
                    </div>
                    <h2 class="section-title">Experience</h2>
                    <div class="experience-terminal" id="experience-terminal">
                        <!-- Experience items go here -->
                    </div>
                </div>
                <div class="scroll-indicator">
                    <div class="scroll-arrow"></div>
                    <span class="scroll-text">scroll</span>
                </div>
            </section>

            <!-- Certifications Section -->
            <section id="certifications" class="section section-full">
                <div class="section-content">
                    <div class="terminal-header">
                        <span class="terminal-prompt">$</span>
                        <span class="terminal-command-static"
                            >cat ~/certifications/*.cert</span
                        >
                    </div>
                    <h2 class="section-title">Training & Certifications</h2>
                    <div class="certifications-terminal">
                        <div class="cert-terminal-output" id="cert-output">
                            <!-- Certifications go here -->
                        </div>
                    </div>
                </div>
                <div class="scroll-indicator">
                    <div class="scroll-arrow"></div>
                    <span class="scroll-text">scroll</span>
                </div>
            </section>

            <!-- Contributions Section -->
            <section id="contributions" class="section section-full">
                <div class="section-content">
                    <div class="terminal-header">
                        <span class="terminal-prompt">$</span>
                        <span class="terminal-command-static"
                            >cat contributions.ts</span
                        >
                    </div>
                    <h2 class="section-title">Contributions</h2>
                    <div
                        class="terminal-output"
                        id="contributions-output"
                    ></div>
                </div>
            </section>
        </div>

        <!-- JS -->
        <script src="js/data.js"></script>
        <script src="js/matrix.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/sections.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
